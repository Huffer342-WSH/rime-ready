name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release tag; defaults to v<RIME_VERSION>-r<PACKAGE_REVISION>'
        required: false
        type: string

permissions:
  contents: write

jobs:
  ct:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ubuntu-22.04
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Run release CT
        run: scripts/ct.sh --target "${{ matrix.target }}"
      - name: Upload tested release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.deb
            dist/SHA256SUMS-*
          if-no-files-found: error

  publish:
    needs: ct
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Determine release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          else
            source versions.env
            tag="v${RIME_VERSION}-r${PACKAGE_REVISION}"
          fi
          [[ "$tag" == v* ]] || { echo "Tag must start with v: $tag" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          remote_ref=$(git ls-remote --tags origin "refs/tags/$TAG^{}" "refs/tags/$TAG" |
            awk '$2 ~ /\^\{\}$/ {peeled=$1} $2 !~ /\^\{\}$/ {direct=$1} END {print peeled ? peeled : direct}')
          if [[ -n $remote_ref ]]; then
            [[ $remote_ref == "$GITHUB_SHA" ]] || {
              echo "Tag $TAG already points to another commit: $remote_ref" >&2
              exit 1
            }
            echo "Reusing existing tag $TAG at $GITHUB_SHA"
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          elif ! gh release create "$TAG" dist/* --generate-notes --verify-tag; then
            # A workflow started by the new tag may publish the same release concurrently.
            sleep 5
            gh release view "$TAG" >/dev/null
            gh release upload "$TAG" dist/* --clobber
          fi
      - name: Record successfully published upstream revisions
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          scripts/update-release-state.sh "$TAG" /tmp/upstream-state.json
          git fetch origin main
          git checkout -B release-state origin/main
          cp /tmp/upstream-state.json upstream-state.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add upstream-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Record upstream state for $TAG"
            git push origin HEAD:main
          fi

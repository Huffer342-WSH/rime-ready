name: Continuous test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ct:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ubuntu-22.04
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Run full CT
        run: scripts/ct.sh --target "${{ matrix.target }}"
      - name: Upload tested packages
        uses: actions/upload-artifact@v4
        with:
          name: rime-ready-${{ matrix.target }}
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS-*
          if-no-files-found: error

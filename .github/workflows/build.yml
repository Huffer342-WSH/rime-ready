name: Continuous test

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Optional PR number to test; leave empty to test the selected ref'
        required: false
        type: string

permissions:
  contents: read

jobs:
  ct:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ubuntu-22.04
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref }}
      - name: Run full CT
        run: scripts/ct.sh --target "${{ matrix.target }}"
      - name: Upload tested packages
        uses: actions/upload-artifact@v4
        with:
          name: rime-ready-${{ matrix.target }}
          path: |
            dist/*.deb
            dist/SHA256SUMS-*
          if-no-files-found: error

name: Watch stable upstream releases

on:
  schedule:
    # Every Monday at 03:23 UTC.
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check stable upstream releases
        id: upstream
        run: |
          result=$(scripts/check-upstream.sh --update)
          echo "$result"
          echo "$result" >> "$GITHUB_OUTPUT"
      - name: Record new pinned versions on main
        if: steps.upstream.outputs.version_file_changed == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add versions.env
          git commit -m "Update stable Rime upstream releases"
          git push origin HEAD:main
      - name: Dispatch release CT
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main
      - name: No update
        if: steps.upstream.outputs.changed != 'true'
        run: echo 'No new stable librime or Rime Ice release.'
